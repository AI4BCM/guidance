# mcp.ai4bcm.org — the AI4BCM guidance connector's public name.
# Canonical copy; the running one would be /etc/nginx/sites-available/mcp-ai4bcm on brain.
# NOT INSTALLED. Every nginx edit on brain is a kgadmin root round; this is round two of
# kb-move ticket 06 and it is blocked on the owner's DNS records (see "Before this installs").
#
# ---------------------------------------------------------------------------------------------
# Why a hostname and not a path — the decision this ticket could not dodge (owner, 2026-09-10)
#
# /mcp was one path with two servers behind it: the BIA session tools on agent.ai4bcm.org, and
# this connector. One of them had to move. The BIA tools did not, and the reason is a caller,
# not a preference: Copilot Studio picks up a changed tool list only on a FRESH conversation,
# never an open one. Moving the endpoint under existing callers means every one of them has to
# be reconfigured AND restarted, and a caller that reconfigures without restarting fails in a
# way that looks like the server is broken.
#
# So the NEW surface takes the new name. The consequence is the good one: agent.ai4bcm.org/mcp
# is untouched, no BIA caller is told anything, and the old endpoint keeps answering because
# nothing was ever done to it. "The old endpoint must answer until callers have moved" is
# satisfied by construction rather than by a migration window someone has to police.
#
# The name is also the product answer. The owner's goal for AI4BCM is a connector people
# install; a connector served from a hostname named after a discontinued product is not that.
# ---------------------------------------------------------------------------------------------
#
# Before this installs — the owner adds two records at All-Inkl, mirroring what agent and
# preview already carry. Measured 2026-09-10: `mcp.ai4bcm.org` resolves to 85.13.156.215,
# which is the All-Inkl wildcard, NOT brain. Without an explicit pair certbot fails in a way
# that reads as a firewall problem:
#
#     mcp   A      95.217.162.203
#     mcp   AAAA   2a01:4f9:c013:a840::1
#
# The AAAA is not optional. A missing one merely falls back to v4; a wrong one breaks issuance.
# Verify against the authoritative server, not only the recursive resolver:
#     dig +short mcp.ai4bcm.org A @ns5.kasserver.com
#     dig +short mcp.ai4bcm.org AAAA @ns5.kasserver.com

# The zone lives HERE, in the site file, not in nginx.conf — a sites-enabled file is included
# inside http{}, which is where limit_req_zone belongs, so the limit installs in ONE root step
# instead of a second edit someone forgets. A location referencing a zone that was never added
# fails the config test, which is the failure mode you want. This is the rule the /demo/claim
# lane on agent.ai4bcm.org already learned; it is carried over rather than re-derived.
#
# What is different from /demo/claim, and why: that lane keys on the METHOD, because an event
# puts forty phones behind one venue NAT and limiting the address would throttle the room the
# lane exists to serve. An MCP connector is not a room — each caller is a person's own client
# on their own address — so the plain address key is right here.
#
# 60r/m with burst=20 nodelay: an MCP client answering one question makes a handful of calls in
# a second (a search, then two or three fetches), and the burst is what lets that pass whole.
# Sustained, it is one call a second — a brake on a script, invisible to a person. Demonstrated
# under real nginx in front of real uvicorn in ticket 04, not reasoned about: the burst passed a
# client's whole answer, every further call answered 429, and the error log named the zone.
limit_req_zone $binary_remote_addr zone=ai4bcm_mcp:1m rate=60r/m;

server {
    listen 80;
    listen [::]:80;
    server_name mcp.ai4bcm.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Pinned to brain's public IPs. Tailscale Serve owns the tailnet 443, so a wildcard
    # `listen 443` here would fight it — never wildcard 443 on brain. Same rule as the
    # agent.ai4bcm.org and ai4bcm.org vhosts. (preview.ai4bcm.org was the third example
    # here until the owner retired that name on 2026-09-10.)
    listen 95.217.162.203:443 ssl http2;
    listen [2a01:4f9:c013:a840::1]:443 ssl http2;
    server_name mcp.ai4bcm.org;

    ssl_certificate     /etc/letsencrypt/live/mcp.ai4bcm.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.ai4bcm.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # This host serves a machine surface, not pages. Nothing here belongs in a search index,
    # and an indexed /mcp is an invitation to exactly the traffic the limit above exists for.
    add_header X-Robots-Tag "noindex, nofollow" always;

    access_log /var/log/nginx/mcp-ai4bcm.access.log;
    error_log  /var/log/nginx/mcp-ai4bcm.error.log warn;

    location /mcp {
        limit_req zone=ai4bcm_mcp burst=20 nodelay;
        # 429, not nginx's default 503, and scoped to this location so it cannot retag another
        # vhost's zone. A rate-limited caller and a broken service must not arrive in the access
        # log as the same status.
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8788/mcp;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Unlimited on purpose: /health is what a monitor polls, and a rate-limited health check
    # reports the limiter rather than the service.
    location = /health {
        proxy_pass http://127.0.0.1:8788/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # The corpus index — every chunk id with the citation it resolves to. Public and
    # unauthenticated, like /health, because the citation contract is meant to be checkable over
    # plain HTTP by anyone (CITATION-CONTRACT.md version 2, 2026-09-12). It has to be reachable:
    # a citation now carries a source file and a GitHub anchor, so it can no longer be built from
    # a chunk id, and brain's daily ai4bcm-citation-drift.sh reads this file to know what to probe.
    #
    # Unlimited for the same reason as /health: a daily gate that gets rate-limited reports the
    # limiter. It is one JSON document, regenerated only by a publish round.
    location = /index.json {
        proxy_pass http://127.0.0.1:8788/index.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        return 404;
    }
}
