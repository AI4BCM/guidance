# The AI4BCM guidance connector's nginx block. NOT INSTALLED — where /mcp lands is
# kb-move ticket 06's decision, and every nginx edit on brain is a kgadmin root round.
#
# This is the second half of the answer to "the connector is open, so what stops a script
# draining it" (owner, 2026-09-10). The first half is that there is nothing to drain: every
# tool is a local lookup over chunks.json, so an abusive caller costs CPU, not money. This
# block is what caps the CPU.
#
# The approach is not invented here. `deploy/nginx-agent-ai4bcm.conf` in bia-workflow already
# carries a limit block for /demo/claim, and the two rules that block learned the hard way are
# carried over verbatim:
#
#   - the zone lives in the SITE file, not nginx.conf. A sites-enabled file is included inside
#     http{}, which is where limit_req_zone belongs, so keeping the zone next to the location
#     it serves means the limit installs in ONE root step instead of a second edit someone
#     forgets — and a location referencing a zone that was never added fails the config test.
#   - `limit_req_status 429`, scoped to the location. nginx's default is 503, which the app
#     also uses for its own faults; two unrelated conditions arriving as the same status make
#     the access log unreadable exactly when someone is reading it. Scoped rather than at
#     http level so it cannot retag another vhost's zone.
#
# What is different from /demo/claim, and why. That lane keys on the METHOD, because an event
# puts forty phones behind one venue NAT and limiting the address would throttle the room the
# lane exists to serve. An MCP connector is not a room: each caller is a person's own client on
# their own address, so the plain address key is right here.
#
# 60r/m with burst=20 nodelay: an MCP client answering one question makes a handful of calls in
# a second (a search, then two or three fetches), and the burst is what lets that pass whole.
# Sustained, it is one call a second — a brake on a script, invisible to a person.
limit_req_zone $binary_remote_addr zone=ai4bcm_mcp:1m rate=60r/m;

# Paste these two locations into the server{} block ticket 06 chooses, above its `location /`.
# The upstream is server.py's default port; 8787 is the BIA endpoint and is NOT this.

location /mcp {
    limit_req zone=ai4bcm_mcp burst=20 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8788/mcp;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}

# Unlimited on purpose: /health is what a monitor polls, and a rate-limited health check
# reports the limiter rather than the service.
location = /health {
    proxy_pass http://127.0.0.1:8788/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}
